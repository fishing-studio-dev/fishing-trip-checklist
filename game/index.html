<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2236">
  <title>漁師ゲーム（試作M3）</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
</head>
<body>
<div id="app">
  <canvas id="view3d" aria-label="海と船の表示"></canvas>

  <div id="hud" hidden>
    <div class="hud-top" id="hudTop"></div>
    <div class="hud-chart panel" id="chartPanel">
      <div class="panel-head"><span id="chartTitle">海図（GPSプロッター）</span><span><button type="button" class="mini" data-act="marks" title="自分の印の一覧（K）">印</button> <button type="button" class="mini" id="chartToggle" data-act="chart" title="海図の拡大（C）">拡大</button></span></div>
      <div class="chart-wrap"><canvas id="chart" width="240" height="240"></canvas></div>
      <div class="chart-foot" id="chartFoot" hidden>
        <p class="chart-msg" id="chartMsg"></p>
        <p class="chart-hint" id="chartHint"></p>
        <div class="chart-tools">
          <span class="seg"><button type="button" class="tool" data-act="chartAll" id="chartAll" title="海域全体">全体</button><button type="button" class="tool" data-act="chartZoomOut" title="縮小（船を中心）">－</button><button type="button" class="tool" data-act="chartZoomIn" title="拡大（船を中心）">＋</button></span>
          <span class="seg"><button type="button" class="tool primary" data-act="route" id="chartGo">航路で移動<kbd>G</kbd></button><button type="button" class="tool" data-act="clearRoute" id="chartClear">消す<kbd>X</kbd></button></span>
        </div>
      </div>
    </div>
    <div class="hud-sounder panel" id="sounderPanel">
      <div class="panel-head"><span id="sounderTitle">魚探</span><span><button type="button" class="mini" id="sideToggle" data-act="sideview" title="真下と左右の表示を切り替え" hidden>左右</button> <button type="button" class="mini" data-act="sounder" title="魚探を閉じる（F）">閉じる</button></span></div>
      <canvas id="sounder" width="260" height="300"></canvas>
      <canvas id="sideview" class="sideview" width="260" height="300" hidden></canvas>
    </div>
    <button type="button" class="sounder-open" id="sounderOpen" data-act="sounder" hidden>魚探を開く（F）</button>
    <div class="hud-sonar panel" id="sonarPanel" hidden>
      <div class="panel-head"><span>ソナー</span><span><button type="button" class="mini" id="sonarRange" data-act="sonarRange" title="探る距離">300m</button> <button type="button" class="mini" data-act="sonar" title="ソナーを閉じる（O）">閉じる</button></span></div>
      <canvas id="sonar" width="240" height="240"></canvas>
    </div>
    <div class="hud-op panel" id="opPanel" hidden></div>
    <div class="hud-msgs" id="msgs" aria-live="polite"></div>
    <div class="coach" id="guide" hidden role="status">
      <div class="guide-title" id="guideTitle"></div>
      <p class="guide-text" id="guideText"></p>
      <div class="guide-acts"><button type="button" class="tool primary" data-act="guideOk">わかった</button><button type="button" class="tool" data-act="guideOff">案内を出さない</button></div>
    </div>
    <div class="walk-bar" id="walkBar" hidden aria-label="持ち場へ移動"></div>
    <div class="hud-controls" id="controls">
      <div class="ctl-group helm" id="helmGroup">
        <button type="button" class="ctl" data-hold="left" aria-label="左へ舵（A）">◀ 舵</button>
        <div class="throttle">
          <button type="button" class="ctl" data-act="throttleUp" aria-label="増速（W）">増速 ▲</button>
          <span id="throttleLabel">停止</span>
          <button type="button" class="ctl" data-act="throttleDown" aria-label="減速（S）">減速 ▼</button>
        </div>
        <button type="button" class="ctl" data-hold="right" aria-label="右へ舵（D）">舵 ▶</button>
      </div>
      <div class="ctl-group helm walkpad" id="walkPad" hidden>
        <button type="button" class="ctl" data-hold="wl" aria-label="左を向く（A）">◀ 向き</button>
        <div class="throttle">
          <button type="button" class="ctl" data-hold="wf" aria-label="前へ歩く（W）">前へ ▲</button>
          <span>甲板</span>
          <button type="button" class="ctl" data-hold="wb" aria-label="後ろへ歩く（S）">後ろ ▼</button>
        </div>
        <button type="button" class="ctl" data-hold="wr" aria-label="右を向く（D）">向き ▶</button>
      </div>
      <div class="ctl-group cmds">
        <button type="button" class="ctl primary" id="btnOp" data-act="op">操業開始<kbd>Space</kbd></button>
        <button type="button" class="ctl" id="btnRedrift" data-act="redrift">流し直し<kbd>R</kbd></button>
        <button type="button" class="ctl" id="btnMethod" data-act="method" title="漁法の切替（T）">一本釣り<kbd>T</kbd></button>
        <button type="button" class="ctl" id="btnClearRoute" data-act="clearRoute" hidden>航路を消す<kbd>X</kbd></button>
        <button type="button" class="ctl" id="btnHaul" data-act="haul" hidden>揚げ縄<kbd>L</kbd></button>
        <button type="button" class="ctl" id="btnRoute" data-act="route" hidden>航路で移動<kbd>G</kbd></button>
        <button type="button" class="ctl" data-act="mark">印<kbd>M</kbd></button>
        <button type="button" class="ctl" id="btnPort" data-act="port">帰港<kbd>H</kbd></button>
      </div>
      <div class="ctl-group sys">
        <button type="button" class="ctl small" id="btnSpeed" data-act="speed" title="時間の早さ（1/2/3）">×1</button>
        <button type="button" class="ctl small" id="btnView" data-act="view" title="視点切替（V）">視点</button>
        <button type="button" class="ctl small" id="btnSonar" data-act="sonar" title="ソナー（O）" hidden>ソナー</button>
        <button type="button" class="ctl small" id="btnPause" data-act="pause" title="一時停止（P）">停止</button>
        <button type="button" class="ctl small" data-act="help" title="操作説明">？</button>
      </div>
    </div>
  </div>

  <section id="screen" class="screen" hidden></section>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="loading" class="loading">読み込み中…</div>
</div>
<noscript><p style="padding:20px">このゲームの実行にはJavaScriptが必要です。</p></noscript>
<script type="module" src="./src/ui/main.js"></script>
</body>
</html>
